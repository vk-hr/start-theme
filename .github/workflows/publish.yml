name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# OIDC for npm trusted publishing. Provenance attestations are generated
# automatically when publishing through the trusted publisher.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bun is the build/test runtime (prepublishOnly scripts).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The final upload must go through the npm CLI: bun publish does not
      # support OIDC (oven-sh/bun#22423). Trusted publishing needs
      # npm >= 11.5.1.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      # npm publish triggers prepublishOnly: typecheck, biome, bun test,
      # bun build. Authenticates via OIDC trusted publishing — no token.
      - name: Publish to npm
        run: npm publish
