name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.2 (leading v is stripped)"
        required: true
        type: string

# OIDC for npm trusted publishing. Provenance attestations are generated
# automatically when publishing through the trusted publisher.
permissions:
  contents: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Bun is the build/test runtime (prepublishOnly scripts).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The final upload must go through the npm CLI: bun publish does not
      # support OIDC (oven-sh/bun#22423). Trusted publishing needs
      # npm >= 11.5.1.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Determine version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            VERSION="${DISPATCH_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Dispatch path: bump, commit to main, push the tag. GITHUB_TOKEN-driven
      # pushes do not re-trigger workflows, so publishing happens in this run.
      - name: Bump version and push release commit
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version
          git add package.json
          git commit -m "chore: release v$VERSION"
          git push origin HEAD:main
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      # npm publish triggers prepublishOnly: typecheck, biome, bun test,
      # bun build. Authenticates via OIDC trusted publishing — no token.
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes
